# All seeds, dates and parameters live here. Scripts run from the repo root.

seed: 42

data:
  start_date: "2015-01-01"
  end_date: "2026-10-30"   # fixed (not "today") so results are reproducible
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  index_ticker: "^NSEI"     # NIFTY 50 index (Yahoo Finance)
  min_history_fraction: 0.95  # drop tickers with less non-missing data than this
  nse_constituents_file: "data/raw/ind_nifty50list.csv"  # official NSE constituents (source of truth)
  tickers_file: "data/nifty50_tickers.csv"  # built from the NSE file by scripts/run_data.py --rebuild-tickers
  # Explicit exclusions: price series are NOT edited, the stocks are removed from the
  # universe. Evidence for each is in docs/limitations.md and
  # outputs/tables/data_jump_inspection.csv.
  excluded_tickers:
    - ticker: "ADANIENT.NS"
      reason: "data-quality exclusion: unadjusted corporate action"
    - ticker: "TRENT.NS"
      reason: "data-quality exclusion: unadjusted corporate action"
    - ticker: "TMPV.NS"
      reason: "data-quality exclusion: unadjusted corporate action"
  # Survivorship bias: current constituents only. See docs/limitations.md.

  cleaning:
    ffill_limit_days: 3     # forward-fill gaps up to this many consecutive days
    jump_threshold: 0.20    # flag |daily simple return| above this as possible split/data error

  plots:
    rolling_vol_window: 60  # trading days, for rolling index volatility
    shaded_periods:
      covid_crash: ["2020-02-01", "2020-03-31"]
      year_2022: ["2022-01-01", "2022-12-31"]

# ASSUMPTION - TO BE CONFIRMED BY YOU: annual risk-free rate of 6.5%
# (placeholder approximating Indian government bond / T-bill yields).
# Not sourced from data; confirm or replace before reporting any Sharpe ratio.
risk_free_rate: 0.065

trading_days: 252

portfolio:
  weight_cap: 0.10          # max weight per asset
  long_only: true

markowitz:
  frontier_points: 50

costs:
  transaction_cost_bps: 10

risk:
  cvar_alpha: 0.95

backtest:
  # ASSUMPTIONS - please confirm
  rolling_window_days: 252  # ~1 trading year
  rebalance_frequency: "M"  # pandas offset alias; M = month-end

paths:
  figures_dir: "outputs/figures"
  tables_dir: "outputs/tables"
  results_log: "docs/results_log.md"

# --- robust portfolio methods (src/robust.py) ---
robust:
  n_draws: 500                 # Michaud resampling draws
  box_z: 1.0                   # ASSUMPTION: half-width of the mean box in standard errors
  ellipsoid_confidence: 0.95   # chi-square quantile level that sets kappa
  risk_aversion: 5.0           # ASSUMPTION: lambda in the ellipsoid mean-variance objective (annualised units)
  cvar_min_return: null        # optional minimum annualised expected return for cvar_min
  nonzero_threshold: 1.0e-4    # weights above this count as a position in demo tables

# --- Wasserstein distributionally robust optimisation (src/wdro.py) ---
wdro:
  ground_norm: 1               # norm on return vectors for the ground metric: 1, 2 or "inf" (dual norm: inf, 2, 1)
  eps_min: 1.0e-5              # Wasserstein radius grid, log-spaced, in daily-return units
  eps_max: 1.0e-1
  eps_points: 13
  mean_weight: 0.0             # m in  m*E[-w'xi] + CVaR ; 0 = pure CVaR
  min_return: null             # optional annualised minimum return (nominal for cvar, worst-case for meanvar)
  top_positions_plot: 10       # positions shown in the stacked-area plot

# --- regime detection (src/regimes.py) ---
regimes:
  vol_window: 21               # rolling realised-volatility window, trading days
  vol_quantiles: [0.33, 0.67]  # ASSUMPTION: lower/upper expanding quantiles of past volatility
  vol_min_history: 252         # past volatility observations required before labelling
  hmm_min_history: 504         # returns required before the first HMM fit
  hmm_refit_every: 21          # refit period, trading days
  hmm_restarts: 5              # random restarts per fit (best likelihood kept)
  hmm_max_iter: 200
  hmm_tol: 1.0e-4

# --- per-regime selection of the Wasserstein radius (src/eps_selection.py) ---
eps_selection:
  kind: "cvar"                 # wdro kind used in the validation blocks
  block_length: 21             # validation block length, trading days
  refit_every: 63              # how often the per-regime eps choice is refreshed, trading days
  min_blocks: 6                # minimum validation blocks per regime, else fall back to the pooled eps
  tie_tolerance: 1.0e-6        # Sharpe values within this of the best are ties, broken by lower realised CVaR
  methods: ["vol_threshold", "hmm2", "hmm3"]

# --- extended eps grid and selection rules (src/eps_selection.py, scripts/run_eps_selection.py) ---
eps_selection_ext:
  plateau_tolerance: 0.01      # the DR solution counts as 1/N when 1/sum(w^2) >= (1 - tolerance) * N in every training window
  rules: ["best", "one_se"]    # best = highest net Sharpe; one_se = smallest eps within one jackknife SE of the best
  output_suffix: "_ext"        # new result files carry this suffix; the original-grid results are kept
  # grid = old wdro grid (13 log-spaced values 1e-5 .. 0.1) plus the points above it up to the first value at which
  # every training window is 1/N within the tolerance (found by --find-grid: one extra point). Superset of the old grid.
  eps_min: 1.0e-5
  eps_max: 0.21544346900318845
  eps_points: 14
